<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Management - Frontend</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <h1>Book Management</h1>
      <p class="tagline">Explore Books, Authors & Publishers</p>
    </div>

    <nav class="nav">
      <button class="nav-btn" data-view="books" aria-label="Books">Books</button>
      <button class="nav-btn" data-view="authors" aria-label="Authors">Authors</button>
      <button class="nav-btn" data-view="publishers" aria-label="Publishers">Publishers</button>
      <button class="nav-btn" data-view="orders" aria-label="Orders">My Orders</button>
      <div class="spacer"></div>
      <button id="auth-btn" class="btn-secondary">Log in</button>
    </nav>
  </header>

  <main class="main" id="app">
    <section class="view" id="books-view" data-view="books">
      <h2>Books</h2>
      <div class="list" id="books-list"></div>
      <div class="panel" id="book-crud" hidden>
        <h3>Admin: Create Book</h3>
        <form id="book-form">
          <div class="field">
            <label for="book-title">Title</label>
            <input id="book-title" name="title" type="text" required />
          </div>
          <div class="field">
            <label for="book-authorId">Author ID</label>
            <input id="book-authorId" name="authorId" type="text" required />
          </div>
          <div class="field">
            <label for="book-publisherId">Publisher ID</label>
            <input id="book-publisherId" name="publisherId" type="text" required />
          </div>
          <div class="field">
            <label for="book-price">Price</label>
            <input id="book-price" name="price" type="number" step="0.01" required />
          </div>
          <div class="field">
            <label for="book-stock">Stock</label>
            <input id="book-stock" name="quantity" type="number" required />
          </div>
          <button class="btn" type="submit">Create Book</button>
        </form>
      </div>
    </section>

    <section class="view" id="authors-view" data-view="authors" hidden>
      <h2>Authors</h2>
      <div class="list" id="authors-list"></div>
      <div class="panel" id="author-crud" hidden>
        <h3>Admin: Create Author</h3>
        <form id="author-form">
          <div class="field">
            <label for="author-name">Name</label>
            <input id="author-name" name="name" type="text" required />
          </div>
          <div class="field">
            <label for="author-bio">Bio</label>
            <textarea id="author-bio" name="bio" rows="3"></textarea>
          </div>
          <button class="btn" type="submit">Create Author</button>
        </form>
      </div>
    </section>

    <section class="view" id="publishers-view" data-view="publishers" hidden>
      <h2>Publishers</h2>
      <div class="list" id="publishers-list"></div>
      <div class="panel" id="publisher-crud" hidden>
        <h3>Admin: Create Publisher</h3>
        <form id="publisher-form">
          <div class="field">
            <label for="publisher-name">Name</label>
            <input id="publisher-name" name="name" type="text" required />
          </div>
          <div class="field">
            <label for="publisher-address">Address</label>
            <input id="publisher-address" name="address" type="text" />
          </div>
          <button class="btn" type="submit">Create Publisher</button>
        </form>
      </div>
    </section>

    <section class="view" id="orders-view" data-view="orders" hidden>
      <h2>My Orders</h2>
      <div class="list" id="orders-list"></div>
      <div class="panel" id="order-create" hidden>
        <h3>Create Order</h3>
        <form id="order-form">
          <div class="field">
            <label for="order-bookId">Book ID</label>
            <input id="order-bookId" name="bookId" type="text" required />
          </div>
          <div class="field">
            <label for="order-quantity">Quantity</label>
            <input id="order-quantity" name="quantity" type="number" min="1" value="1" required />
          </div>
          <button class="btn" type="submit">Place Order</button>
        </form>
      </div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <div class="modal" id="auth-modal" aria-hidden="true">
    <div class="modal-content">
      <button class="close" id="auth-close" aria-label="Close">×</button>
      <h2 id="auth-title">Log in</h2>
      <form id="auth-form">
        <div class="field">
          <label for="auth-email">Email</label>
          <input id="auth-email" name="email" type="email" required />
        </div>
        <div class="field">
          <label for="auth-password">Password</label>
          <input id="auth-password" name="password" type="password" required />
        </div>
        <button class="btn" type="submit" id="auth-submit">Log in</button>
      </form>
      <div class="switch">
        <span id="auth-switch-text">New here?</span>
        <button class="btn-link" id="auth-switch">Create account</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
